<div class="sheet-t200-sheet">

  <input type="hidden" class="sheet-tabstoggle" name="attr_sheetTab" value="character">

  <div class="sheet-tab-bar">
    <button type="action" name="act_character" class="sheet-tab-button sheet-tab-button-character">Character Sheet</button>
    <button type="action" name="act_equipment" class="sheet-tab-button sheet-tab-button-equipment">Equipment</button>
    <button type="action" name="act_vehicle" class="sheet-tab-button sheet-tab-button-vehicle">Vehicle</button>
  </div>

  <div class="sheet-tab-content sheet-tab-character">
<!-- MAIN_HTML -->
  </div>

  <div class="sheet-tab-content sheet-tab-equipment">
<!-- EQUIPMENT_HTML -->
  </div>

  <div class="sheet-tab-content sheet-tab-vehicle">
<!-- VEHICLE_HTML -->
  </div>

</div>

<script type="text/worker">
  const t200Tabs = ["character", "equipment", "vehicle"];
  t200Tabs.forEach(function (tab) {
    on("clicked:" + tab, function () {
      setAttrs({ sheetTab: tab });
    });
  });
</script>
